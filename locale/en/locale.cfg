[shortcut-description]
line-loss-toggle-feed-paths=For the transformer you last hovered or opened: the shortest resistance-weighted paths from its sources, coloured by the line loss accumulated on the way (green to red), wider for a bigger share. Hides Power Overload's network colouring while on.
line-loss-toggle-grid-diagram=Every route between transformers on the map, width = power, colour = line loss of that route. A diamond on each receiving transformer, coloured by its total upstream loss (everything lost between the generators and it): green under 10%, yellow under 50%, red above.
line-loss-toggle-heatmap=A dot on every pole. Colour: line loss of the power reaching it from the nearest transformer, green under 0.5% to red at 50% and above. Size: power lost delivering the machine load on that pole, from 1 kW up; transmission poles keep the smallest size.

[mod-setting-name]
line-loss-enabled=Line losses
line-loss-per-tile=Line loss per tile (%)
line-loss-closeness=Line losses: feed nearest consumers first
line-loss-machine-weighting=Line losses: weight machines by their live load
line-loss-transformer-efficiency=Transformer efficiency
line-loss-no-load=Transformer core loss (%)
line-loss-show-idle-routes=Grid diagram: show idle routes
line-loss-show-loss-check=Transformer panel: show input - output next to total loss
line-loss-panel-same-unit=Transformer panel: one unit for all power figures

[mod-setting-description]
line-loss-enabled=Power loses extra energy the farther it travels between transformers. A transformer shows the upstream line loss (of the power coming to it) and the downstream line loss (on its downstream network). Distance is measured along the wires and weighted by pole type: small poles have much higher resistance than big or huge poles. The lost power is drawn by a hidden "Line loss" consumer on each transformer's downstream network.
line-loss-per-tile=Percentage of a transformer's output lost per tile of resistance-weighted distance (big electric pole = 1 per tile). Total line loss is capped at 95%: at least 5% of the power always arrives.
line-loss-closeness=When several transformers feed the same network, assign each one's power mostly to the consumers nearest to it (current divides inversely with wire resistance) instead of sharing it out evenly. Each transformer's delivered power and each consumer's draw stay as measured. Building generation close to loads then reduces line losses.
line-loss-transformer-efficiency=How much energy a transformer outputs for each unit it takes in. The difference is drawn by a hidden "Transf. ineff." consumer on the transformer's upstream network, so it shows in the electric network statistics.\nSet Power Overload's own "Transformer efficiency" to 1, otherwise this setting is ignored.

line-loss-no-load=Core loss: constant loss of a switched-on transformer, as a percentage of its rating, even with no load. A transformer is rated by the weaker of its two sides: the highest-rated pole wired to each side, and the smaller of the two. Drawn with the inefficiency by its "Transf. ineff." consumer on the upstream network. 0 turns it off.

line-loss-machine-weighting=Off: machines count as spread evenly over a network's poles. On: each pole is weighted by the machines in its supply area and what that machine type is drawing right now, so a power-hungry machine at the far end of a line costs more than lamps there, and an idle machine almost nothing. Costs extra script time: an entity search per pole whenever a network is searched again, which also happens whenever an electric machine is built or removed.

line-loss-panel-same-unit=Shows every power figure in the panel in the unit of the largest one (e.g. 1MW, 0.1MW, 0.3MW), so they are easy to compare. Off: each figure in its own unit.
line-loss-show-loss-check=For checking: adds input minus output to the Total loss row, which should equal the sum of the losses.
line-loss-show-idle-routes=Also draw grid-diagram routes and diamonds that carry no power right now (in grey). Off by default to keep the map readable.

