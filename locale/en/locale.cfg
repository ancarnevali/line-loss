ineff-tooltip=Lost inside the transformer at the "Transformer efficiency" setting, burned by its "Transf. ineff." consumer on the network it draws from.
no-load-tooltip=Constant loss while switched on, like a real transformer's core: a percentage of its rating. Its rating is the weaker of its two sides (the highest-rated pole wired to each side).
drawing-tooltip=Total power taken from the network it draws from, losses inside this transformer included.
output-tooltip=Power it gives to the network it feeds, and how much of that is left after the line loss on that network.
