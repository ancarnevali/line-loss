[shortcut-description]
line-loss-toggle-loss-map=Shows on the map how much power is lost delivering the machine load on each pole, from its nearest transformer: bigger and redder dots lose more, from 1 kW (small, yellow) up. With "weight machines by their live load" on, it follows where the machines actually are and what they draw right now; otherwise machine load counts as spread evenly over the poles.
line-loss-toggle-heatmap=Colours every pole on the map by the line loss of the power reaching it from the nearest transformer: green under 0.5%, then yellow around 2–5%, orange around 10–20%, red 50% and above.

[mod-setting-name]
line-loss-enabled=Line losses
line-loss-per-tile=Line loss per tile (%)
line-loss-closeness=Line losses: feed nearest consumers first
line-loss-machine-weighting=Line losses: weight machines by their live load
line-loss-transformer-efficiency=Transformer efficiency
line-loss-no-load=Transformer core loss (%)
line-loss-show-idle-routes=Grid diagram: show idle routes

[mod-setting-description]
line-loss-enabled=Power loses extra energy the farther it travels between transformers. The loss shown on a transformer is that of the power arriving at it. Distance is measured along the wires and weighted by pole type: small poles have much higher resistance than big or huge poles. The loss is burned by a hidden "Line loss" consumer on each transformer's output network.
line-loss-per-tile=Percentage of a transformer's output lost per tile of resistance-weighted distance (big electric pole = 1 per tile). Total line loss is capped at 95%: at least 5% of the power always arrives.
line-loss-closeness=When several transformers feed the same network, assign each one's power mostly to the consumers nearest to it (current divides inversely with wire resistance) instead of sharing it out evenly. Each transformer's delivered power and each consumer's draw stay as measured. Building generation close to loads then reduces line losses.
line-loss-transformer-efficiency=How much energy a transformer outputs for each unit it takes in. The difference is burned by a hidden "Transf. ineff." consumer on the transformer's input network, so it shows in the electric network statistics.\nSet Power Overload's own "Transformer efficiency" to 1, otherwise this setting is ignored.

line-loss-no-load=Core loss: constant loss of a switched-on transformer, as a percentage of its rating, even with no load. A transformer is rated by the weaker of its two sides: the highest-rated pole wired to each side, and the smaller of the two. Burned with the inefficiency by its "Transf. ineff." consumer on the input network. 0 turns it off.

line-loss-machine-weighting=Off: machines count as spread evenly over a network's poles. On: each pole is weighted by the machines in its supply area and what that machine type is drawing right now, so a power-hungry machine at the far end of a line costs more than lamps there, and an idle machine almost nothing. Costs extra script time: an entity search per pole whenever a network is searched again, which also happens whenever an electric machine is built or removed.

line-loss-show-idle-routes=Also draw grid-diagram routes and diamonds that carry no power right now (in grey). Off by default to keep the map readable.

