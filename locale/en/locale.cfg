[mod-setting-description]
line-loss-enabled=Enable line losses. In transmission networks, power splits over parallel lines by resistance, and a wire loses more the more power it carries. In distribution networks, each pole is fed by its nearest transformer or generators and loses a fixed share per tile. Each transformer pays the losses on the power it supplies through a "Line loss" consumer.
line-loss-per-tile=Power lost per tile, weighted by pole resistance. Transmission wires lose this amount when carrying a quarter of their rating. This rate grows linearly with power transported. This rate can't be lower than a tenth of this amount, and can't exceed 95%
line-loss-mixed-wires=Adding transmission poles to a distribution network is a way to improve its conductivity, and lower its line loss. This setting makes this strategy less advantageous, by doubling (default) the resistance of transmission poles in distribution networks. Step down through a transformer instead!
line-loss-transformer-efficiency=Transformer efficiency. Set Power Overload's "Transformer efficiency" to 1, to avoid double counting.

line-loss-no-load=Constant loss of a switched-on transformer, as a share of its rating, even with no load. A transformer's rating is the rating of the strongest pole on its weaker side. 0 turns it off.

line-loss-machine-weighting=Resistance weighted distance along copper wires is used to assign consumers to the nearest source.\nOff: spreads load evenly over all poles.\nOn: dispatches load according to the machines' live power draw. Power hungry machines far away from transformers contribute more to the network's line loss. Costs extra script time when a network changes.

line-loss-panel-same-unit=Show every power figure in the unit of the largest one (e.g. 1 MW, 0.1 MW, 0.3 MW), for easy comparison.
line-loss-show-loss-check=Add input − output next to the total loss. It should equal the sum of the losses.

