[shortcut-description]
line-loss-toggle-line-loading=Display power line loading. Red wire carries more power than green wire. Dashed wire means transmission poles are connected to a distribution network. This results in a resistance penalty. Hover a transformer to see what feeds it.
line-loss-toggle-line-loading-rated=Display power line loading as a share of the weaker pole in the network. Yellow above 60%, red above 80%. Dashed wire means transmission poles are connected to a distribution network. This results in a resistance penalty. Hover a transformer to see what feeds it.
line-loss-toggle-losses=Display power lost on each wire. Red wire loses more than green wire, across all wires on the surface. Diamonds show each transformer's total upstream loss. Dashed wire means transmission poles are connected to a distribution network. This results in a resistance penalty. Hover or open a transformer to see its downstream network's power panel.
line-loss-toggle-networks=Display network types. Blue wire is a transmission network. In distribution networks, each wire takes the colour of the transformer feeding it. If multiple sources feed a consumer, the wires are colored in grey. Hover a transformer to see what feeds it.

